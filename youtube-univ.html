<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유튜브 대학 · 나의 강의 서재</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#FAF5EC; --paper:#FFFDF8; --ink:#2B2622; --ink-soft:#6B6258;
    --line:#E8DFCF; --coral:#D9613C; --coral-soft:#F2D9CC; --coral-ink:#9C3F22;
    --gold:#C99A3F; --green:#5C7A57; --shadow:rgba(60,45,30,.10);
    --sans:'Pretendard',system-ui,sans-serif; --serif:'Gowun Batang',serif;
    --r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans); color:var(--ink); background:var(--bg);
    background-image:radial-gradient(var(--line) .6px,transparent .6px);
    background-size:22px 22px; line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  ::selection{background:var(--coral-soft)}

  /* ── 헤더 ── */
  header.top{
    position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:14px;
    padding:13px 22px; background:rgba(250,245,236,.86); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:11px; font-family:var(--serif); font-weight:700}
  .brand .mark{
    width:34px; height:34px; border-radius:9px; display:grid; place-items:center;
    background:linear-gradient(135deg,var(--coral),#E8895F); color:#fff; font-size:18px;
    box-shadow:0 3px 10px var(--shadow);
  }
  .brand .name{font-size:19px; letter-spacing:-.3px}
  .brand .sub{font-family:var(--sans); font-size:11.5px; color:var(--ink-soft); font-weight:500}
  .top-spacer{flex:1}
  .stat-pill{
    font-size:12.5px; color:var(--ink-soft); background:var(--paper); border:1px solid var(--line);
    padding:6px 13px; border-radius:999px; white-space:nowrap;
  }
  .stat-pill b{color:var(--coral-ink); font-weight:700}
  .menu-btn{display:none; background:none; border:1px solid var(--line); border-radius:9px;
    width:38px; height:36px; font-size:18px; cursor:pointer; color:var(--ink)}

  /* ── 레이아웃 ── */
  .app{display:grid; grid-template-columns:328px 1fr; min-height:calc(100vh - 61px)}
  aside.side{
    border-right:1px solid var(--line); background:var(--paper);
    display:flex; flex-direction:column; max-height:calc(100vh - 61px); position:sticky; top:61px;
  }
  .side-top{padding:16px 16px 10px}
  .search{position:relative}
  .search input{
    width:100%; font-family:var(--sans); font-size:14px; padding:11px 13px 11px 36px;
    border:1px solid var(--line); border-radius:11px; background:var(--bg); color:var(--ink);
  }
  .search input:focus{outline:none; border-color:var(--coral); background:var(--paper)}
  .search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.5}
  .views{display:flex; gap:6px; margin-top:11px}
  .views button{
    flex:1; font-family:var(--sans); font-size:12.5px; font-weight:600; padding:8px 4px; cursor:pointer;
    border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--ink-soft);
    transition:.15s;
  }
  .views button.on{background:var(--coral); border-color:var(--coral); color:#fff}
  .cats{display:flex; flex-wrap:wrap; gap:6px; padding:10px 16px 4px}
  .cats .chip{
    font-size:12px; padding:5px 11px; border-radius:999px; cursor:pointer; border:1px solid var(--line);
    background:var(--bg); color:var(--ink-soft); transition:.15s;
  }
  .cats .chip.on{background:var(--coral-soft); border-color:var(--coral); color:var(--coral-ink); font-weight:600}
  .list{overflow-y:auto; padding:8px 12px 24px; flex:1}
  .card{
    display:flex; gap:11px; padding:9px; border-radius:12px; cursor:pointer; margin-bottom:4px;
    border:1px solid transparent; transition:.15s; position:relative;
  }
  .card:hover{background:var(--bg)}
  .card.on{background:var(--coral-soft); border-color:var(--coral)}
  .card .thumb{
    width:84px; height:48px; flex:none; border-radius:8px; object-fit:cover; background:var(--line);
    box-shadow:0 1px 4px var(--shadow);
  }
  .card .ci{min-width:0; flex:1}
  .card .ct{font-size:13px; font-weight:600; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .card .cm{font-size:11px; color:var(--ink-soft); margin-top:3px; display:flex; gap:6px; align-items:center}
  .card .dot{display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--coral)}
  .card .check{position:absolute; top:7px; right:7px; font-size:11px; color:var(--green)}
  .empty-list{padding:30px 18px; text-align:center; color:var(--ink-soft); font-size:13px}

  /* ── 본문 ── */
  main.content{padding:0; min-width:0}
  .welcome{max-width:560px; margin:9vh auto; text-align:center; padding:0 24px}
  .welcome .big{font-family:var(--serif); font-size:30px; font-weight:700; letter-spacing:-.5px}
  .welcome p{color:var(--ink-soft); margin-top:12px; font-size:15px}
  .welcome .hint{margin-top:22px; font-size:13px; background:var(--paper); border:1px solid var(--line);
    border-radius:12px; padding:16px 18px; text-align:left; color:var(--ink-soft)}

  .player-wrap{background:#1a1714; z-index:20}
  .player-inner{max-width:920px; margin:0 auto}
  .ratio{position:relative; width:100%; padding-top:56.25%}
  .ratio iframe,.ratio #ytplayer{position:absolute; inset:0; width:100%; height:100%; border:0}

  .doc{max-width:760px; margin:0 auto; padding:26px 28px 80px}
  .vhead{border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:8px}
  .vhead .vcat{display:inline-block; font-size:11.5px; font-weight:700; color:var(--coral-ink);
    background:var(--coral-soft); padding:3px 10px; border-radius:999px; letter-spacing:.2px}
  .vhead h1{font-family:var(--serif); font-size:26px; font-weight:700; line-height:1.3; margin:12px 0 6px; letter-spacing:-.4px}
  .vhead .meta{font-size:13px; color:var(--ink-soft); display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center}
  .vhead .meta a{color:var(--coral-ink); text-decoration:none; font-weight:600}
  .vtags{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
  .vtags span{font-size:11.5px; color:var(--ink-soft); background:var(--bg); border:1px solid var(--line); padding:3px 9px; border-radius:999px}

  .actbar{display:flex; gap:9px; margin:16px 0 6px; flex-wrap:wrap}
  .btn{font-family:var(--sans); font-size:13px; font-weight:600; cursor:pointer; padding:8px 14px;
    border-radius:10px; border:1px solid var(--line); background:var(--paper); color:var(--ink); transition:.15s}
  .btn:hover{border-color:var(--coral)}
  .btn.primary{background:var(--coral); border-color:var(--coral); color:#fff}
  .btn.done{background:var(--green); border-color:var(--green); color:#fff}

  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin:22px 0 0}
  .tabs button{font-family:var(--sans); font-size:14px; font-weight:600; padding:11px 16px; cursor:pointer;
    background:none; border:0; border-bottom:2.5px solid transparent; color:var(--ink-soft); margin-bottom:-1px}
  .tabs button.on{color:var(--coral-ink); border-color:var(--coral)}

  section.blk{margin-top:26px}
  .lab{font-size:13px; font-weight:700; color:var(--coral-ink); display:flex; align-items:center; gap:7px;
    letter-spacing:.2px; margin-bottom:10px}
  .lab .ic{font-size:15px}
  .oneliner{font-family:var(--serif); font-size:20px; line-height:1.5; font-weight:700; color:var(--ink);
    border-left:3px solid var(--coral); padding:4px 0 4px 16px; margin-top:4px}
  .prose{font-size:15.5px; line-height:1.85; color:#3a342d}
  .prose p{margin-bottom:14px}
  .concept{border:1px solid var(--line); border-radius:12px; padding:13px 15px; margin-bottom:9px; background:var(--paper)}
  .concept b{color:var(--coral-ink); font-size:14.5px}
  .concept p{font-size:14px; color:var(--ink-soft); margin-top:4px}
  ol.flow{list-style:none; counter-reset:f}
  ol.flow li{counter-increment:f; position:relative; padding:9px 0 9px 38px; border-bottom:1px dashed var(--line); font-size:14.5px}
  ol.flow li:last-child{border-bottom:0}
  ol.flow li::before{content:counter(f); position:absolute; left:0; top:8px; width:25px; height:25px;
    background:var(--coral-soft); color:var(--coral-ink); border-radius:50%; font-size:12px; font-weight:700;
    display:grid; place-items:center}
  .row{display:flex; gap:12px; padding:11px 13px; border:1px solid var(--line); border-radius:12px; margin-bottom:8px;
    background:var(--paper); cursor:pointer; transition:.15s}
  .row:hover{border-color:var(--coral); background:#fff}
  .ts{flex:none; font-variant-numeric:tabular-nums; font-size:12.5px; font-weight:700; color:#fff;
    background:var(--coral); padding:3px 8px; border-radius:7px; height:fit-content}
  .row .rb{min-width:0}
  .row .rb .rt{font-size:14.5px; font-weight:600}
  .row .rb .rd{font-size:13px; color:var(--ink-soft); margin-top:3px}
  .insight{background:linear-gradient(135deg,#FFF4E8,#FCEBDD); border:1px solid var(--coral-soft);
    border-radius:14px; padding:18px 20px; font-size:15.5px; line-height:1.8; color:#4a3d30}
  ul.take{list-style:none}
  ul.take li{position:relative; padding:8px 0 8px 28px; font-size:15px; border-bottom:1px dashed var(--line)}
  ul.take li:last-child{border-bottom:0}
  ul.take li::before{content:'✓'; position:absolute; left:2px; top:8px; color:var(--green); font-weight:700}
  .qcard{border:1px solid var(--line); border-radius:12px; padding:0; margin-bottom:9px; overflow:hidden; background:var(--paper)}
  .qcard .q{padding:13px 16px; font-size:14.5px; font-weight:600; cursor:pointer; display:flex; justify-content:space-between; gap:10px}
  .qcard .q .arr{color:var(--coral); transition:.2s}
  .qcard.open .q .arr{transform:rotate(90deg)}
  .qcard .a{max-height:0; overflow:hidden; transition:max-height .25s ease; font-size:14px; color:var(--ink-soft)}
  .qcard.open .a{max-height:240px}
  .qcard .a .inner{padding:0 16px 14px}

  .related{display:grid; grid-template-columns:1fr 1fr; gap:9px}
  .related .rc{display:flex; gap:9px; padding:8px; border:1px solid var(--line); border-radius:11px; cursor:pointer; background:var(--paper); transition:.15s}
  .related .rc:hover{border-color:var(--coral)}
  .related .rc img{width:64px; height:38px; border-radius:7px; object-fit:cover; flex:none; background:var(--line)}
  .related .rc .t{font-size:12.5px; font-weight:600; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}


  /* 복습/용어사전 뷰 */
  .panel{max-width:760px; margin:0 auto; padding:30px 28px 80px}
  .panel h2{font-family:var(--serif); font-size:24px; font-weight:700; letter-spacing:-.4px}
  .panel .desc{color:var(--ink-soft); font-size:14px; margin:6px 0 22px}
  .gitem{border-bottom:1px solid var(--line); padding:13px 0; cursor:pointer}
  .gitem b{font-size:15.5px; color:var(--coral-ink)}
  .gitem p{font-size:14px; color:var(--ink-soft); margin-top:3px}
  .gitem .src{font-size:11.5px; color:var(--coral); margin-top:5px}
  .rev-card{border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:12px; background:var(--paper)}
  .rev-card .rh{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
  .rev-card .rh .rt{font-weight:700; font-size:15.5px; cursor:pointer}
  .rev-card .rh .rt:hover{color:var(--coral-ink)}
  .rev-card .ago{font-size:11.5px; color:var(--ink-soft); white-space:nowrap; padding-top:3px}
  .rev-card .ql{margin-top:10px; padding-left:18px}
  .rev-card .ql li{font-size:14px; margin-bottom:6px; color:#4a3d30}
  .rev-card .reveal{margin-top:12px}
  .rev-card .reveal summary{cursor:pointer; font-size:13px; font-weight:600; color:var(--coral-ink)}
  .rev-card .reveal ul{list-style:none; margin-top:8px}
  .rev-card .reveal li{font-size:13.5px; color:var(--ink-soft); padding:4px 0 4px 18px; position:relative}
  .rev-card .reveal li::before{content:'·'; position:absolute; left:6px; color:var(--coral)}

  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    aside.side{position:fixed; top:61px; left:0; bottom:0; width:300px; z-index:50; max-height:none;
      transform:translateX(-104%); transition:transform .22s ease; box-shadow:8px 0 30px var(--shadow)}
    body.side-open aside.side{transform:none}
    .menu-btn{display:block}
    .stat-pill{display:none}
    .scrim{position:fixed; inset:61px 0 0; background:rgba(40,30,20,.3); z-index:45; opacity:0; pointer-events:none; transition:.2s}
    body.side-open .scrim{opacity:1; pointer-events:auto}
    .player-wrap{position:static}
    .doc,.panel{padding:20px 18px 70px}
    .related{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header class="top">
  <button class="menu-btn" id="menuBtn" aria-label="메뉴">☰</button>
  <div class="brand">
    <div class="mark">▶</div>
    <div><div class="name">유튜브 대학</div><div class="sub">영상을 지식으로 — 나의 강의 서재</div></div>
  </div>
  <div class="top-spacer"></div>
  <div class="stat-pill" id="statPill">불러오는 중…</div>
</header>

<div class="scrim" id="scrim"></div>

<div class="app">
  <aside class="side">
    <div class="side-top">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="text" placeholder="제목·태그·내용 검색">
      </div>
      <div class="views">
        <button data-view="library" class="on">📚 서재</button>
        <button data-view="review">🔁 복습</button>
        <button data-view="glossary">📖 용어사전</button>
      </div>
    </div>
    <div class="cats" id="cats"></div>
    <div class="list" id="list"></div>
  </aside>

  <main class="content" id="content"></main>
</div>

<script src="library.js"></script>
<script>
/* ===== 상태 ===== */
var LIB = (window.YTU_LIBRARY || []).slice();
var view = 'library', curId = null, curTab = 'learn';
var query = '', activeCat = '전체';
var player = null, ytReady = false, playerVid = null;

/* ===== 유틸 ===== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(sec){ sec=Math.max(0,Math.floor(sec||0)); var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  var p=function(n){return (n<10?'0':'')+n;}; return h>0? h+':'+p(m)+':'+p(s) : m+':'+p(s); }
function ytLink(id,sec){ return 'https://www.youtube.com/watch?v='+id+(sec?('&t='+Math.floor(sec)+'s'):''); }
function byId(id){ for(var i=0;i<LIB.length;i++){ if(LIB[i].video_id===id) return LIB[i]; } return null; }

/* ===== 진도 저장 (localStorage) ===== */
var PKEY='ytu_progress_v1';
function loadProg(){ try{ return JSON.parse(localStorage.getItem(PKEY))||{}; }catch(e){ return {}; } }
function saveProg(p){ try{ localStorage.setItem(PKEY,JSON.stringify(p)); }catch(e){} }
function prog(id){ var p=loadProg(); return p[id]||{}; }
function setStudied(id,on){ var p=loadProg(); p[id]=p[id]||{}; p[id].studied=on;
  if(on){ p[id].studiedAt=p[id].studiedAt||Date.now(); } saveProg(p); }
function markReviewed(id){ var p=loadProg(); p[id]=p[id]||{studied:true,studiedAt:Date.now()};
  p[id].reviewCount=(p[id].reviewCount||0)+1; p[id].lastReview=Date.now(); saveProg(p); }

/* ===== YouTube IFrame ===== */
window.onYouTubeIframeAPIReady=function(){ ytReady=true; if(curId && view==='library') ensurePlayer(curId); };
function ensurePlayer(id){
  var host=document.getElementById('ytplayer'); if(!host) return;
  if(!ytReady){ return; }
  if(!player){
    player=new YT.Player('ytplayer',{videoId:id,playerVars:{rel:0,modestbranding:1}});
    playerVid=id;
  } else if(playerVid!==id){
    player.cueVideoById(id); playerVid=id;
  }
}
function seek(sec,id){
  if(player && ytReady && playerVid===id){
    player.seekTo(sec,true); player.playVideo();
    var pw=document.querySelector('.player-wrap'); if(pw) pw.scrollIntoView({behavior:'smooth',block:'start'});
    return true;
  }
  return false; /* 실패 시 호출부가 링크로 폴백 */
}

/* ===== 사이드바 ===== */
function matchQuery(v,qq){
  if(!qq) return true;
  var hay=[v.title,v.channel,v.oneLiner,v.summary,v.explainer,v.insight,(v.tags||[]).join(' ')].join(' ').toLowerCase();
  return hay.indexOf(qq)>=0;
}
function filtered(){
  var qq=query.trim().toLowerCase();
  return LIB.filter(function(v){
    if(activeCat!=='전체' && (v.category||'기타')!==activeCat) return false;
    return matchQuery(v,qq);
  });
}
function renderCats(){
  var set={}, cats=['전체'];
  LIB.forEach(function(v){ var c=v.category||'기타'; if(!set[c]){ set[c]=1; cats.push(c); } });
  var box=document.getElementById('cats'); box.innerHTML='';
  cats.forEach(function(c){
    var b=document.createElement('span'); b.className='chip'+(c===activeCat?' on':''); b.textContent=c;
    b.onclick=function(){ activeCat=c; renderCats(); renderList(); };
    box.appendChild(b);
  });
}
function renderList(){
  var box=document.getElementById('list'); var arr=filtered(); box.innerHTML='';
  if(!arr.length){ box.innerHTML='<div class="empty-list">조건에 맞는 강의가 없어요.</div>'; return; }
  arr.forEach(function(v){
    var p=prog(v.video_id);
    var el=document.createElement('div'); el.className='card'+(v.video_id===curId?' on':'');
    el.innerHTML=
      '<img class="thumb" src="'+esc(v.thumbnail||('https://i.ytimg.com/vi/'+v.video_id+'/mqdefault.jpg'))+'" loading="lazy" alt="">'+
      '<div class="ci"><div class="ct">'+esc(v.title)+'</div>'+
      '<div class="cm"><span class="dot"></span>'+esc(v.category||'기타')+
      (v.channel?(' · '+esc(v.channel)):'')+'</div></div>'+
      (p.studied?'<span class="check">✓ 학습</span>':'');
    el.onclick=function(){ openVideo(v.video_id); closeSideMobile(); };
    box.appendChild(el);
  });
}
function renderStat(){
  var st=loadProg(); var done=0; LIB.forEach(function(v){ if(st[v.video_id]&&st[v.video_id].studied) done++; });
  document.getElementById('statPill').innerHTML='강의 <b>'+LIB.length+'</b>편 · 학습완료 <b>'+done+'</b>편';
}

/* ===== 학습 탭 ===== */
function tsRow(id,sec,title,desc){
  return '<div class="row" data-sec="'+sec+'" data-vid="'+esc(id)+'">'+
    '<span class="ts">'+fmt(sec)+'</span><div class="rb"><div class="rt">'+esc(title)+'</div>'+
    (desc?'<div class="rd">'+esc(desc)+'</div>':'')+'</div></div>';
}
function relatedHtml(v){
  var mine=(v.tags||[]); if(!mine.length) return '';
  var scored=LIB.filter(function(o){return o.video_id!==v.video_id;}).map(function(o){
    var c=0,t=o.tags||[]; mine.forEach(function(x){ if(t.indexOf(x)>=0) c++; }); return {o:o,c:c};
  }).filter(function(x){return x.c>0;}).sort(function(a,b){return b.c-a.c;}).slice(0,4);
  if(!scored.length) return '';
  var h='<section class="blk"><div class="lab"><span class="ic">🧷</span>연결된 강의</div><div class="related">';
  scored.forEach(function(x){ var o=x.o;
    h+='<div class="rc" data-open="'+esc(o.video_id)+'"><img src="'+esc(o.thumbnail||('https://i.ytimg.com/vi/'+o.video_id+'/mqdefault.jpg'))+'" loading="lazy" alt=""><div class="t">'+esc(o.title)+'</div></div>';
  });
  return h+'</div></section>';
}
function learnHtml(v){
  var h='';
  if(v.oneLiner) h+='<section class="blk"><div class="oneliner">'+esc(v.oneLiner)+'</div></section>';
  if(v.summary) h+='<section class="blk"><div class="lab"><span class="ic">🧠</span>요약</div><div class="prose"><p>'+esc(v.summary)+'</p></div></section>';
  if(v.explainer){
    var paras=String(v.explainer).split(/\n\n+/).map(function(p){return '<p>'+esc(p)+'</p>';}).join('');
    h+='<section class="blk"><div class="lab"><span class="ic">📖</span>해설</div><div class="prose">'+paras+'</div></section>';
  }
  if((v.keyConcepts||[]).length){
    h+='<section class="blk"><div class="lab"><span class="ic">🧩</span>핵심 개념</div>';
    v.keyConcepts.forEach(function(c){ h+='<div class="concept"><b>'+esc(c.term)+'</b><p>'+esc(c.explain)+'</p></div>'; });
    h+='</section>';
  }
  if((v.logicFlow||[]).length){
    h+='<section class="blk"><div class="lab"><span class="ic">🔗</span>논리 흐름</div><ol class="flow">';
    v.logicFlow.forEach(function(s){ h+='<li>'+esc(s)+'</li>'; }); h+='</ol></section>';
  }
  if((v.chapters||[]).length){
    h+='<section class="blk"><div class="lab"><span class="ic">📚</span>챕터 <span style="font-weight:400;color:var(--ink-soft);font-size:12px">· 클릭하면 그 지점 재생</span></div>';
    v.chapters.forEach(function(c){ h+=tsRow(v.video_id,c.time,c.title,c.desc); }); h+='</section>';
  }
  if((v.highlights||[]).length){
    h+='<section class="blk"><div class="lab"><span class="ic">⭐</span>핵심 구간</div>';
    v.highlights.forEach(function(c){ h+=tsRow(v.video_id,c.time,c.text,c.reason); }); h+='</section>';
  }
  if(v.insight) h+='<section class="blk"><div class="lab"><span class="ic">💡</span>인사이트</div><div class="insight">'+esc(v.insight)+'</div></section>';
  if((v.takeaways||[]).length){
    h+='<section class="blk"><div class="lab"><span class="ic">✅</span>핵심 정리</div><ul class="take">';
    v.takeaways.forEach(function(t){ h+='<li>'+esc(t)+'</li>'; }); h+='</ul></section>';
  }
  if((v.reviewQuestions||[]).length){
    h+='<section class="blk"><div class="lab"><span class="ic">❓</span>복습 질문</div>';
    v.reviewQuestions.forEach(function(qq){
      h+='<div class="qcard"><div class="q">'+esc(qq)+'<span class="arr">›</span></div>'+
         '<div class="a"><div class="inner">스스로 답을 떠올려 보세요. 위 핵심 정리·해설과 맞춰보면 좋아요.</div></div></div>';
    });
    h+='</section>';
  }
  h+=relatedHtml(v);
  return h;
}


/* ===== 영상 열기 / 탭 ===== */
function openVideo(id){
  view='library'; curId=id; curTab='learn';
  document.querySelectorAll('.views button').forEach(function(b){ b.classList.toggle('on',b.dataset.view==='library'); });
  renderVideo(); renderList(); window.scrollTo(0,0);
}
function renderVideo(){
  var v=byId(curId); var c=document.getElementById('content'); if(!v){ renderWelcome(); return; }
  var p=prog(v.video_id);
  c.innerHTML=
    '<div class="player-wrap"><div class="player-inner"><div class="ratio"><div id="ytplayer"></div></div></div></div>'+
    '<div class="doc">'+
      '<div class="vhead"><span class="vcat">'+esc(v.category||'기타')+'</span>'+
      '<h1>'+esc(v.title)+'</h1>'+
      '<div class="meta">'+(v.channel?('<span>'+esc(v.channel)+'</span>'):'')+
      '<a href="'+ytLink(v.video_id,0)+'" target="_blank" rel="noopener">유튜브에서 보기 ↗</a></div>'+
      '<div class="vtags">'+(v.tags||[]).map(function(t){return '<span>#'+esc(t)+'</span>';}).join('')+'</div></div>'+
      '<div class="actbar">'+
        '<button class="btn '+(p.studied?'done':'primary')+'" id="studyBtn">'+(p.studied?'✓ 학습완료':'학습완료로 표시')+'</button>'+
      '</div>'+
      '<div class="tabs"><button data-tab="learn" class="on">학습</button></div>'+
      '<div id="pane"></div>'+
    '</div>';
  // 탭
  c.querySelectorAll('.tabs button').forEach(function(b){
    b.onclick=function(){ curTab=b.dataset.tab;
      c.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('on',x===b);});
      drawPane(); };
  });
  // 학습완료
  document.getElementById('studyBtn').onclick=function(){
    var np=!prog(v.video_id).studied; setStudied(v.video_id,np);
    this.className='btn '+(np?'done':'primary'); this.textContent=np?'✓ 학습완료':'학습완료로 표시';
    renderStat(); renderList();
  };
  drawPane();
  ensurePlayer(v.video_id);
}
function drawPane(){
  var v=byId(curId), pane=document.getElementById('pane'); if(!pane||!v) return;
  pane.innerHTML=learnHtml(v);
}

/* ===== 복습 뷰 ===== */
function timeAgo(ts){ if(!ts) return ''; var d=(Date.now()-ts)/86400000;
  if(d<1) return '오늘'; if(d<2) return '어제'; return Math.floor(d)+'일 전'; }
function renderReview(){
  var c=document.getElementById('content'); var st=loadProg();
  var arr=LIB.filter(function(v){ return st[v.video_id]&&st[v.video_id].studied; })
    .map(function(v){ var s=st[v.video_id]; return {v:v, last:(s.lastReview||s.studiedAt||0)}; })
    .sort(function(a,b){ return a.last-b.last; }); // 오래 안 본 순
  var h='<div class="panel"><h2>🔁 복습</h2><div class="desc">학습완료한 강의를 오래된 순으로 모았어요. 질문에 스스로 답해 보고, 다 떠올렸다면 복습 완료를 눌러 주세요.</div>';
  if(!arr.length){ h+='<div class="empty-list">아직 학습완료한 강의가 없어요. 서재에서 강의를 보고 "학습완료"로 표시해 보세요.</div></div>'; c.innerHTML=h; return; }
  arr.forEach(function(x){ var v=x.v, s=st[v.video_id];
    h+='<div class="rev-card"><div class="rh"><div class="rt" data-open="'+esc(v.video_id)+'">'+esc(v.title)+'</div>'+
       '<div class="ago">'+(s.lastReview?('복습 '+(s.reviewCount||0)+'회 · '+timeAgo(s.lastReview)):('학습 '+timeAgo(s.studiedAt)))+'</div></div>';
    if((v.reviewQuestions||[]).length){ h+='<ul class="ql">'+v.reviewQuestions.map(function(q){return '<li>'+esc(q)+'</li>';}).join('')+'</ul>'; }
    if((v.takeaways||[]).length){ h+='<details class="reveal"><summary>핵심 정리 펼쳐 답 맞춰보기</summary><ul>'+v.takeaways.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul></details>'; }
    h+='<div style="margin-top:12px"><button class="btn primary" data-review="'+esc(v.video_id)+'">복습 완료</button></div></div>';
  });
  h+='</div>'; c.innerHTML=h;
}

/* ===== 용어사전 뷰 ===== */
function renderGlossary(){
  var c=document.getElementById('content'); var qq=query.trim().toLowerCase();
  var seen={}, items=[];
  LIB.forEach(function(v){ (v.keyConcepts||[]).forEach(function(k){
    var key=(k.term||'').trim().toLowerCase(); if(!key||seen[key]) return; seen[key]=1;
    items.push({term:k.term, explain:k.explain, vid:v.video_id, title:v.title});
  });});
  items.sort(function(a,b){ return a.term.localeCompare(b.term,'ko'); });
  if(qq) items=items.filter(function(it){ return (it.term+' '+it.explain).toLowerCase().indexOf(qq)>=0; });
  var h='<div class="panel"><h2>📖 용어사전</h2><div class="desc">서재의 모든 강의에서 핵심 개념을 모은 나만의 사전이에요. 용어를 누르면 그 강의로 이동합니다. ('+items.length+'개)</div>';
  if(!items.length){ h+='<div class="empty-list">아직 정리된 용어가 없어요.</div>'; }
  items.forEach(function(it){
    h+='<div class="gitem" data-open="'+esc(it.vid)+'"><b>'+esc(it.term)+'</b><p>'+esc(it.explain)+'</p><div class="src">↳ '+esc(it.title)+'</div></div>';
  });
  h+='</div>'; c.innerHTML=h;
}

/* ===== 환영 화면 ===== */
function renderWelcome(){
  document.getElementById('content').innerHTML=
   '<div class="welcome"><div class="big">영상을 지식으로</div>'+
   '<p>왼쪽 서재에서 강의를 골라 학습하세요. 타임스탬프를 누르면 위 영상이 그 지점부터 재생됩니다.</p>'+
   (LIB.length?'':'<div class="hint">아직 강의가 없어요. 유튜브 링크와 자막을 정리해서 첫 강의를 추가해 보세요.</div>')+'</div>';
}

/* ===== 뷰 전환 ===== */
function setView(v){
  view=v; query=''; var qi=document.getElementById('q'); if(qi) qi.value='';
  document.querySelectorAll('.views button').forEach(function(b){ b.classList.toggle('on',b.dataset.view===v); });
  if(v==='library'){ if(curId) renderVideo(); else renderWelcome(); }
  else if(v==='review') renderReview();
  else renderGlossary();
}

/* ===== 전역 클릭(위임): 타임스탬프 점프 + 카드 이동 ===== */
document.addEventListener('click',function(e){
  var ts=e.target.closest('[data-sec]');
  if(ts){ var sec=parseInt(ts.getAttribute('data-sec'),10)||0; var vid=ts.getAttribute('data-vid');
    if(!seek(sec,vid)){ window.open(ytLink(vid,sec),'_blank','noopener'); } return; }
  var op=e.target.closest('[data-open]');
  if(op){ openVideo(op.getAttribute('data-open')); return; }
  var rev=e.target.closest('[data-review]');
  if(rev){ markReviewed(rev.getAttribute('data-review')); renderReview(); renderStat(); return; }
  var qc=e.target.closest('.qcard .q');
  if(qc){ qc.parentElement.classList.toggle('open'); return; }
});

/* ===== 입력/뷰 바인딩 ===== */
document.getElementById('q').addEventListener('input',function(e){
  query=e.target.value;
  if(view==='library') renderList();
  else if(view==='glossary') renderGlossary();
});
document.querySelectorAll('.views button').forEach(function(b){
  b.addEventListener('click',function(){ setView(b.dataset.view); });
});
var menuBtn=document.getElementById('menuBtn'), scrim=document.getElementById('scrim');
function closeSideMobile(){ document.body.classList.remove('side-open'); }
menuBtn.addEventListener('click',function(){ document.body.classList.toggle('side-open'); });
scrim.addEventListener('click',closeSideMobile);

/* ===== 초기 렌더 ===== */
renderCats(); renderList(); renderStat(); renderWelcome();

/* YouTube IFrame API 로드 */
(function(){ var s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s); })();
</script>
